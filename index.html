<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { font-family: 'Roboto', sans-serif; }
        .relay-card { transition: all 0.3s ease; }
        .relay-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- HEADER INSTITUCIONAL -->
    <header class="bg-blue-900 text-white shadow-lg border-b-4 border-red-600">

            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-full">
                    <i data-lucide="graduation-cap" class="w-8 h-8 text-blue-900"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">TUVN</h1>
                    <p class="text-xs text-blue-200 font-semibold tracking-widest">AUTOMATIZACIÓN E INSTRUMENTACIÓN</p>
                </div>
            </div>

            <!-- Indicador de Estado -->
            <div class="flex items-center gap-3 bg-blue-950/50 px-4 py-2 rounded-lg border border-blue-400/30">
                <div class="relative flex h-3 w-3">
                  <span id="staticDot" class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </div>
                <span id="statusText" class="text-sm font-mono text-emerald-300">Modo API Activo</span>
            </div>
        </div>
    </header>

                <i data-lucide="user-circle" class="w-4 h-4 text-red-600"></i>
                <span class="font-medium">Desarrollador: <span class="text-blue-900 font-bold">Carlos Ruiz</span></span>
            </div>
            <div class="flex gap-4 font-mono text-slate-500">
                <span id="dateDisplay">--/--/----</span>
                <span id="timeDisplay" class="text-blue-700 font-bold">--:--:--</span>
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mx-auto px-4 py-8 max-w-2xl flex-grow">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-80
