<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUVN - Control Global por API Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <header class="bg-blue-900 text-white p-4 border-b-4 border-red-600 shadow-lg text-center">
        <h1 class="text-2xl font-bold">TUVN - Control Web por API Key</h1>
        <p class="text-xs text-blue-200">Control IoT vía Internet mediante Adafruit IO REST API</p>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-lg">
        <!-- Tarjeta de Configuración API -->
        <div class="bg-white p-4 rounded-xl shadow border border-slate-200 mb-6">
            <h3 class="font-bold text-slate-700 mb-3 text-sm">Credenciales de API</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-500 font-semibold">AIO USERNAME</label>
                    <input type="text" id="aioUser" placeholder=" " class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-500 font-semibold">AIO KEY (API KEY)</label>
                    <input type="password" id="aioKey" placeholder=" " class="w-full border rounded p-2 text-sm">
                </div>
            </div>
        </div>

        <!-- Matriz de Control de Relés -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border text-center">
                <span class="font-bold text-slate-700 block mb-2">Relé 1 (D25)</span>
                <div class="flex gap-2">
                    <button onclick="sendApiCommand('R1_ON')" class="bg-emerald-600 text-white font-bold py-2 w-full rounded hover:bg-emerald-700">ON</button>
                    <button onclick="sendApiCommand('R1_OFF')" class="bg-slate-700 text-white font-bold py-2 w-full rounded hover:bg-slate-800">OFF</button>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border text-center">
                <span class="font-bold text-slate-700 block mb-2">Relé 2 (D26)</span>
                <div class="flex gap-2">
                    <button onclick="sendApiCommand('R2_ON')" class="bg-emerald-600 text-white font-bold py-2 w-full rounded hover:bg-emerald-700">ON</button>
                    <button onclick="sendApiCommand('R2_OFF')" class="bg-slate-700 text-white font-bold py-2 w-full rounded hover:bg-slate-800">OFF</button>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border text-center">
                <span class="font-bold text-slate-700 block mb-2">Relé 3 (D27)</span>
                <div class="flex gap-2">
                    <button onclick="sendApiCommand('R3_ON')" class="bg-emerald-600 text-white font-bold py-2 w-full rounded hover:bg-emerald-700">ON</button>
                    <button onclick="sendApiCommand('R3_OFF')" class="bg-slate-700 text-white font-bold py-2 w-full rounded hover:bg-slate-800">OFF</button>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border text-center">
                <span class="font-bold text-slate-700 block mb-2">Relé 4 (D33)</span>
                <div class="flex gap-2">
                    <button onclick="sendApiCommand('R4_ON')" class="bg-emerald-600 text-white font-bold py-2 w-full rounded hover:bg-emerald-700">ON</button>
                    <button onclick="sendApiCommand('R4_OFF')" class="bg-slate-700 text-white font-bold py-2 w-full rounded hover:bg-slate-800">OFF</button>
                </div>
            </div>
        </div>

        <div class="flex gap-3">
            <button onclick="sendApiCommand('ALL_ON')" class="bg-blue-700 text-white font-bold py-3 w-full rounded-lg hover:bg-blue-800">ENCENDER TODOS</button>
            <button onclick="sendApiCommand('ALL_OFF')" class="bg-red-700 text-white font-bold py-3 w-full rounded-lg hover:bg-red-800">APAGAR TODOS</button>
        </div>
        
        <div id="statusLog" class="mt-4 text-center text-xs text-slate-500 font-mono"></div>
    </main>

    <footer class="bg-slate-900 text-slate-500 py-4 text-center text-xs border-t-4 border-red-600">
        © 2025 Instituto Superior Tecnológico Vida Nueva
    </footer>

    <script>
        async function sendApiCommand(command) {
            const user = document.getElementById('aioUser').value.trim();
            const key = document.getElementById('aioKey').value.trim();
            const log = document.getElementById('statusLog');

            if (!user || !key) {
                alert("Por favor ingresa tu Username y tu API Key de Adafruit IO.");
                return;
            }

            log.innerText = "Enviando comando por API...";

            // Endpoint de la API REST de Adafruit IO
            const url = `https://io.adafruit.com/api/v2/${user}/feeds/reles/data`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'X-AIO-Key': key,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ value: command })
                });

                if (response.ok) {
                    log.innerText = `Comando "${command}" enviado con éxito.`;
                } else {
                    log.innerText = "Error en la petición API: " + response.statusText;
                }
            } catch (error) {
                log.innerText = "Error de red al conectar con la API.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
